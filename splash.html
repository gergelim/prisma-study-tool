<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>know — Inicializando</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    .splash-card {
      width: 440px;
      height: 300px;
      background: #0c0f17;
      border: 1px solid rgba(140, 211, 255, 0.18);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(140, 211, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      -webkit-app-region: drag;
      animation: splashFadeIn 0.35s ease-out;
    }

    @keyframes splashFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .brand-symbol {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #8CD3FF 0%, #38bdf8 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: #0c0f17;
      box-shadow: 0 4px 18px rgba(140, 211, 255, 0.35);
    }

    .brand-text {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
      color: #f1f5f9;
      display: flex;
      align-items: baseline;
    }

    .brand-dot {
      color: #FF513E;
      font-size: 36px;
      line-height: 0;
      margin-left: 2px;
    }

    .splash-subtitle {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
      margin-bottom: 34px;
      letter-spacing: 0.2px;
    }

    /* Progress bar */
    .progress-container {
      width: 280px;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 40%;
      background: linear-gradient(90deg, #8CD3FF 0%, #FF513E 100%);
      border-radius: 99px;
      animation: indeterminate 1.4s infinite ease-in-out;
    }

    @keyframes indeterminate {
      0%   { left: -40%; width: 40%; }
      50%  { left: 30%;  width: 55%; }
      100% { left: 100%; width: 40%; }
    }

    .splash-status {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
    }

    .splash-version {
      position: absolute;
      bottom: 14px;
      right: 18px;
      font-size: 11px;
      color: #475569;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="brand-group">
      <div class="brand-symbol">k</div>
      <div class="brand-text">know<span class="brand-dot">•</span></div>
    </div>
    <div class="splash-subtitle">Prática Inteligente de Questões</div>

    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>

    <div class="splash-status" id="splash-status">Preparando seus estudos...</div>
    <div class="splash-version">v1.0.0</div>
  </div>
</body>
</html>
